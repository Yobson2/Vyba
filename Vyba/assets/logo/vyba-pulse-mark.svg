<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <linearGradient id="pulseGradient" x1="0" y1="0" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B0A3FF"/>
      <stop offset="100%" stop-color="#6C5CE7"/>
    </linearGradient>
  </defs>

  <!-- V Pulse Wave Mark
       A heartbeat/audio pulse: flat baseline → sharp upward V peak → flat baseline
       Rendered as a bold filled shape (not a thin stroke) for scalability -->
  <path d="
    M 16 126
    L 68 126
    L 114 46
    L 126 46
    L 172 126
    L 224 126
    L 224 142
    L 164 142
    L 120 66
    L 76 142
    L 16 142
    Z
  " fill="url(#pulseGradient)"/>

  <!-- Pulse Dot - "live now" accent -->
  <circle cx="200" cy="94" r="14" fill="#FF2D78"/>
</svg>
