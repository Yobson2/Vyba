<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 160" width="520" height="160">
  <defs>
    <linearGradient id="pulseGradient" x1="0" y1="0" x2="140" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B0A3FF"/>
      <stop offset="100%" stop-color="#6C5CE7"/>
    </linearGradient>
  </defs>

  <!-- === PULSE MARK (left side) === -->
  <g transform="translate(0, 10)">
    <path d="
      M 8 78
      L 38 78
      L 64 26
      L 72 26
      L 98 78
      L 128 78
      L 128 88
      L 94 88
      L 69 42
      L 44 88
      L 8 88
      Z
    " fill="url(#pulseGradient)"/>
    <!-- Pulse Dot -->
    <circle cx="116" cy="56" r="8" fill="#FF2D78"/>
  </g>

  <!-- === WORDMARK "Vyba" (dark text for light backgrounds) === -->
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Epilogue:wght@700&amp;display=swap');
    .wordmark {
      font-family: 'Epilogue', sans-serif;
      font-weight: 700;
      font-size: 72px;
      letter-spacing: -1.5px;
    }
    .tagline {
      font-family: 'Inter', 'Helvetica Neue', sans-serif;
      font-weight: 500;
      font-size: 16px;
      letter-spacing: 4px;
    }
  </style>

  <text x="152" y="105" class="wordmark" fill="#060E20">Vyba</text>
  <text x="156" y="132" class="tagline" fill="#6B7394">Abidjan PULSE</text>
</svg>
