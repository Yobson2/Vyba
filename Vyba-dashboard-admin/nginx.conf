server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # --- Security Headers ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.vyba.app; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-XSS-Protection "0" always;

    # --- Static Assets (hashed filenames = immutable) ---
    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- SPA Routing ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Block sensitive paths ---
    location ~ /\. { deny all; }
    location = /robots.txt { allow all; }
    location = /.well-known/security.txt { allow all; }
}
